name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PKG: github:lieox/sendpulse-whatsapp-mcp
  DISABLE_AUTOUPDATER: "1"

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - name: Committed dist/ matches src/
        run: git diff --exit-code -- dist
      - name: Smoke test (local build)
        run: npm test
      - name: Smoke test (npm install -g from GitHub, Windows)
        if: runner.os == 'Windows'
        run: |
          npm install -g "$env:PKG#$env:GITHUB_SHA"
          node test/smoke.mjs cmd /c sendpulse-whatsapp-mcp
      # npx with a pinned "#<sha>" fails on npm 10 ("GitFetcher requires an Arborist constructor"),
      # so this commit is tested through npm install -g. The plain npx command users run is
      # tested in the claude-code job.
      - name: Smoke test (npm install -g from GitHub, macOS)
        if: runner.os == 'macOS'
        run: |
          npm install -g "$PKG#$GITHUB_SHA"
          node test/smoke.mjs sendpulse-whatsapp-mcp

  # Runs the README install commands inside a real Claude Code, then asks Claude Code itself
  # to connect: `claude mcp get` starts the server and reports Connected or Failed.
  claude-code:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, install: native }
          - { os: windows-latest, install: npm }
          - { os: macos-latest, install: native }
    runs-on: ${{ matrix.os }}
    name: claude-code (${{ matrix.os }}, ${{ matrix.install }})
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code (native, Windows)
        if: runner.os == 'Windows' && matrix.install == 'native'
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install Claude Code (npm, Windows)
        if: runner.os == 'Windows' && matrix.install == 'npm'
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Claude Code (native, macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version

      - name: "Windows step 1: npm install -g"
        if: runner.os == 'Windows'
        run: npm install -g github:lieox/sendpulse-whatsapp-mcp

      - name: "Windows step 2 in PowerShell 7"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          claude mcp add -e SENDPULSE_CLIENT_ID=fake -e SENDPULSE_CLIENT_SECRET=fake -e SENDPULSE_READ_ONLY=1 -s user sp-pwsh cmd /c sendpulse-whatsapp-mcp
          $out = claude mcp get sp-pwsh | Out-String; $out
          if ($out -notmatch 'Connected') { exit 1 }
      - name: "Windows step 2 in Windows PowerShell 5.1"
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          claude mcp add -e SENDPULSE_CLIENT_ID=fake -e SENDPULSE_CLIENT_SECRET=fake -e SENDPULSE_READ_ONLY=1 -s user sp-ps51 cmd /c sendpulse-whatsapp-mcp
          $out = claude mcp get sp-ps51 | Out-String; $out
          if ($out -notmatch 'Connected') { exit 1 }
      - name: "Windows step 2 in Command Prompt"
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call claude mcp add -e SENDPULSE_CLIENT_ID=fake -e SENDPULSE_CLIENT_SECRET=fake -e SENDPULSE_READ_ONLY=1 -s user sp-cmd cmd /c sendpulse-whatsapp-mcp
          call claude mcp get sp-cmd > out.txt
          type out.txt
          findstr /C:"Connected" out.txt

      - name: "Info only: Windows without cmd /c"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          claude mcp add -e SENDPULSE_CLIENT_ID=fake -e SENDPULSE_CLIENT_SECRET=fake -s user sp-plain sendpulse-whatsapp-mcp
          $out = claude mcp get sp-plain | Out-String; $out
          if ($out -notmatch 'Connected') { exit 1 }

      - name: "macOS: one command, cold npx cache"
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: |
          claude mcp add sp-mac -s user -e SENDPULSE_CLIENT_ID=fake -e SENDPULSE_CLIENT_SECRET=fake -e SENDPULSE_READ_ONLY=1 -- npx -y github:lieox/sendpulse-whatsapp-mcp
          claude mcp get sp-mac | tee out.txt
          grep -q Connected out.txt
